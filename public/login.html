<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Connexion — FuelLog</title>
  <meta name="theme-color" content="#0e0f11">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-page">
  <form class="login-card" method="post" action="/login">
    <div class="logo login-logo"><span class="g">fuel</span><span class="i">log</span></div>
    <span class="badge">panel · administration</span>
    <p class="login-error" id="login-error" style="display:none">Mot de passe incorrect.</p>
    <input type="password" name="password" placeholder="Mot de passe" autocomplete="current-password" autofocus required>
    <button type="submit" class="btn primary full">Se connecter</button>
    <a class="forgot-link" href="/mot-de-passe-oublie">Mot de passe oublié ?</a>
  </form>
  <script>
    if (new URLSearchParams(location.search).has('error')) {
      document.getElementById('login-error').style.display = 'block';
    }
  </script>
</body>
</html>
