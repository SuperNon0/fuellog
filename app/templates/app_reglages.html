{# Partial « Réglages de l'application » FuelLog — inclus par /reglages (base). #}
<section class="acct-section">
  <h3>Carburant par défaut</h3>
  <form method="post" action="{{ url_for('app.reglages_enregistrer') }}">
    <div class="fl-card" style="display:flex;flex-direction:column;gap:12px">
      <label class="fl-label" for="app_carburant">Type de carburant présélectionné à la saisie d'un plein</label>
      <select id="app_carburant" name="app_carburant" style="margin-top:6px">
        {% for c in ["E10", "SP95", "SP98", "Diesel", "E85"] %}
        <option value="{{ c }}" {{ "selected" if app_carburant == c else "" }}>{{ c }}</option>
        {% endfor %}
      </select>
      <div style="display:flex;justify-content:flex-end">
        <button type="submit" class="btn primary">Enregistrer</button>
      </div>
    </div>
  </form>
  <p class="access-note" style="text-align:left;margin-top:8px">
    La gestion des véhicules, des types d'entretien et l'export/sauvegarde des
    données se font depuis l'onglet <b>Gestion</b> de FuelLog.
  </p>
</section>
